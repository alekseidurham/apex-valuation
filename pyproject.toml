[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-valuation"
version = "1.0.0"
description = "Institutional M&A & DCF Engine with Monte Carlo Sensitivity Analysis"
authors = [{ name = "Aleksei Rogozin", email = "aleksei.rogozin@durham.ac.uk" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "yfinance>=0.2.30",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
